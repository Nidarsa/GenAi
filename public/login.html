<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sastra Deemed University</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .auth-wrapper {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 60%, #0ea5e9 100%);
    }
    .sastra-header {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .sastra-header .uni-icon {
      font-size: 3.2rem;
      line-height: 1;
    }
    .sastra-header .welcome-text {
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #06b6d4;
      margin-top: .5rem;
    }
    .sastra-header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      color: #1e293b;
      margin-top: .25rem;
      line-height: 1.25;
    }
    .sastra-header .subtitle {
      font-size: .85rem;
      color: #64748b;
      margin-top: .3rem;
    }
    .sastra-divider {
      border: none;
      border-top: 1px solid #e2e8f0;
      margin: 1.2rem 0;
    }
  </style>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-box">

    <!-- Sastra Branding -->
    <div class="sastra-header">
      <div class="uni-icon">🏛️</div>
      <div class="welcome-text">Welcome to</div>
      <h1>Sastra Deemed University</h1>
      <div class="subtitle">Online Admission Portal — 2026</div>
    </div>

    <hr class="sastra-divider" />

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-student" onclick="switchTab('student')">🎒 Student Login</button>
      <button class="auth-tab"        id="tab-admin"   onclick="switchTab('admin')">🛡️ Admin Login</button>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
      </div>

      <div id="admin-hint" style="display:none;margin-bottom:.9rem;">
        <div class="alert alert-info show" style="margin:0;">
          🛡️ Default admin — <strong>admin@college.edu</strong> / <strong>admin123</strong>
        </div>
      </div>

      <div class="alert" id="login-alert"></div>

      <button type="submit" class="btn btn-primary btn-full" id="login-btn">
        <span id="login-label">Sign In</span>
      </button>
    </form>

    <div id="student-switch" class="auth-switch" style="margin-top:1rem;">
      New applicant? <a href="/register.html">Create an account</a>
    </div>
    <div id="admin-switch" class="auth-switch" style="display:none;margin-top:1rem;">
      Admin access only. Contact IT to reset credentials.
    </div>
  </div>
</div>

<script>
  let activeRole = 'student';

  function switchTab(role) {
    activeRole = role;
    document.getElementById('tab-student').classList.toggle('active', role === 'student');
    document.getElementById('tab-admin').classList.toggle('active',   role === 'admin');
    document.getElementById('admin-hint').style.display      = role === 'admin'   ? 'block' : 'none';
    document.getElementById('student-switch').style.display  = role === 'student' ? 'block' : 'none';
    document.getElementById('admin-switch').style.display    = role === 'admin'   ? 'block' : 'none';
    hideAlert();
  }

  function showAlert(msg, type='error') {
    const el = document.getElementById('login-alert');
    el.textContent = msg;
    el.className = 'alert alert-' + type + ' show';
  }
  function hideAlert() {
    document.getElementById('login-alert').className = 'alert';
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideAlert();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');
    const label    = document.getElementById('login-label');
    btn.disabled = true; label.textContent = 'Signing in…';

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) { showAlert(data.error || 'Login failed.'); return; }

      if (activeRole === 'admin' && data.role !== 'admin') {
        showAlert('This account does not have admin access.'); return;
      }
      if (activeRole === 'student' && data.role !== 'student') {
        showAlert('Please use the Admin tab to sign in as admin.'); return;
      }

      showAlert('Login successful! Redirecting…', 'success');
      setTimeout(() => { window.location.href = data.redirect; }, 600);
    } catch {
      showAlert('Network error. Please try again.');
    } finally {
      btn.disabled = false; label.textContent = 'Sign In';
    }
  }
</script>
</body>
</html>
