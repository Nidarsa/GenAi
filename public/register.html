<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Sastra Deemed University</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .auth-wrapper {
      background: linear-gradient(135deg, #1e3a5f 0%, #4f46e5 60%, #06b6d4 100%);
    }
    .sastra-header {
      text-align: center;
      margin-bottom: 1.6rem;
    }
    .sastra-header .uni-icon { font-size: 3rem; line-height: 1; }
    .sastra-header .welcome-text {
      font-size: .82rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      color: #06b6d4; margin-top: .5rem;
    }
    .sastra-header h1 { font-size: 1.35rem; font-weight: 800; color: #1e293b; margin-top: .25rem; }
    .sastra-header .subtitle { font-size: .83rem; color: #64748b; margin-top: .25rem; }
    .sastra-divider { border:none; border-top:1px solid #e2e8f0; margin:1.1rem 0; }
  </style>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-box">

    <!-- Sastra Branding -->
    <div class="sastra-header">
      <div class="uni-icon">🏛️</div>
      <div class="welcome-text">Welcome to</div>
      <h1>Sastra Deemed University</h1>
      <div class="subtitle">Create your applicant account</div>
    </div>

    <hr class="sastra-divider" />

    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" class="form-control" placeholder="Enter your full name" required />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" />
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" class="form-control" placeholder="Re-enter your password" required />
      </div>

      <div class="alert" id="reg-alert"></div>

      <button type="submit" class="btn btn-primary btn-full" id="reg-btn">
        <span id="reg-label">Create Account</span>
      </button>
    </form>

    <div class="auth-switch" style="margin-top:1rem;">
      Already registered? <a href="/login.html">Sign in here</a>
    </div>
  </div>
</div>

<script>
  function showAlert(msg, type='error') {
    const el = document.getElementById('reg-alert');
    el.textContent = msg;
    el.className = 'alert alert-' + type + ' show';
  }

  async function handleRegister(e) {
    e.preventDefault();
    const full_name = document.getElementById('full_name').value.trim();
    const email     = document.getElementById('email').value.trim();
    const password  = document.getElementById('password').value;
    const confirm   = document.getElementById('confirm').value;
    const btn       = document.getElementById('reg-btn');
    const label     = document.getElementById('reg-label');

    if (password !== confirm) { showAlert('Passwords do not match.'); return; }
    if (password.length < 6)  { showAlert('Password must be at least 6 characters.'); return; }

    btn.disabled = true; label.textContent = 'Creating account…';

    try {
      const res  = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name, email, password }),
      });
      const data = await res.json();
      if (!res.ok) { showAlert(data.error || 'Registration failed.'); return; }
      showAlert('Account created! Redirecting…', 'success');
      setTimeout(() => { window.location.href = data.redirect; }, 800);
    } catch {
      showAlert('Network error. Please try again.');
    } finally {
      btn.disabled = false; label.textContent = 'Create Account';
    }
  }
</script>
</body>
</html>
