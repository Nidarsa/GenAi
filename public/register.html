<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — College Admission Portal</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="icon">🎓</div>
      <h1>Create Account</h1>
      <p>Register to apply for admission</p>
    </div>

    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" class="form-control" placeholder="Enter your full name" required />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" />
      </div>
      <div class="form-group">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" class="form-control" placeholder="Re-enter password" required />
      </div>

      <div class="alert" id="reg-alert"></div>

      <button type="submit" class="btn btn-primary btn-full" id="reg-btn">
        <span id="reg-label">Create Account</span>
      </button>
    </form>

    <div class="auth-switch">
      Already have an account? <a href="/login.html">Sign in</a>
    </div>
  </div>
</div>

<script>
  function showAlert(msg, type = 'error') {
    const el = document.getElementById('reg-alert');
    el.textContent = msg;
    el.className = `alert alert-${type} show`;
  }

  async function handleRegister(e) {
    e.preventDefault();
    const full_name = document.getElementById('full_name').value.trim();
    const email     = document.getElementById('email').value.trim();
    const password  = document.getElementById('password').value;
    const confirm   = document.getElementById('confirm').value;
    const btn       = document.getElementById('reg-btn');
    const label     = document.getElementById('reg-label');

    if (password !== confirm) { showAlert('Passwords do not match.'); return; }
    if (password.length < 6)  { showAlert('Password must be at least 6 characters.'); return; }

    btn.disabled = true;
    label.textContent = 'Creating account…';

    try {
      const res  = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name, email, password }),
      });
      const data = await res.json();
      if (!res.ok) { showAlert(data.error || 'Registration failed.'); return; }
      showAlert('Account created! Redirecting…', 'success');
      setTimeout(() => { window.location.href = data.redirect; }, 800);
    } catch {
      showAlert('Network error. Please try again.');
    } finally {
      btn.disabled = false;
      label.textContent = 'Create Account';
    }
  }
</script>
</body>
</html>
