<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal — Admission Chatbot</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { overflow: hidden; }
    strong { font-weight: 700; }
    .msg-bubble strong { font-weight: 700; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="navbar-brand"><span class="icon">🎓</span> Admission Portal</div>
  <div class="navbar-right">
    <div class="navbar-user">Welcome, <span id="nav-name">Student</span></div>
    <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- LAYOUT -->
<div class="student-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <!-- Profile -->
    <div>
      <h3>My Profile</h3>
      <div class="profile-card">
        <div class="name" id="profile-name">Loading…</div>
        <div class="role">Student Applicant</div>
      </div>
    </div>

    <!-- Booking Status -->
    <div>
      <h3>Booking Status</h3>
      <div class="booking-status none" id="booking-status-card">
        <div class="label">No Booking Yet</div>
        <div class="value" style="color:var(--muted);font-size:.82rem;">Complete the chat to book a seat</div>
      </div>
    </div>

    <!-- Programs -->
    <div>
      <h3>Available Programs</h3>
      <div class="programs-list" id="programs-list">
        <div style="font-size:.82rem;color:var(--muted);">Loading…</div>
      </div>
    </div>

    <!-- Quick links -->
    <div style="margin-top:auto;">
      <h3>Quick Actions</h3>
      <div style="display:flex;flex-direction:column;gap:.4rem;">
        <button class="program-chip" onclick="sendQuick('Show all programs and cutoffs')">📋 View All Courses</button>
        <button class="program-chip" onclick="sendQuick('Show available counseling slots')">📅 View Slots</button>
        <button class="program-chip" onclick="sendQuick('Suggest based on my interests')">💡 Get Recommendation</button>
      </div>
    </div>
  </aside>

  <!-- CHAT + BOOKING -->
  <div class="chat-area">

    <!-- Chat header -->
    <div class="chat-header">
      <div class="bot-avatar">🤖</div>
      <div>
        <h2>Admission Assistant</h2>
        <p>Ask me anything about courses, seats, and bookings</p>
      </div>
      <div class="chat-online"></div>
    </div>

    <!-- Quick action pills -->
    <div class="quick-actions">
      <button class="quick-btn" onclick="sendQuick('I want CSE')">💻 CSE</button>
      <button class="quick-btn" onclick="sendQuick('I want AI & Data Science')">🤖 AI & DS</button>
      <button class="quick-btn" onclick="sendQuick('I want Mechanical')">⚙️ Mechanical</button>
      <button class="quick-btn" onclick="sendQuick('I want ECE')">📡 ECE</button>
      <button class="quick-btn" onclick="sendQuick('I want Civil')">🏗️ Civil</button>
      <button class="quick-btn" onclick="sendQuick('I want Biotechnology')">🧬 Biotech</button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chat-messages"></div>

    <!-- Input -->
    <div class="chat-input-area">
      <textarea id="chat-input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="btn btn-primary" onclick="sendMessage()">Send ➤</button>
    </div>
  </div>
</div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  // States: idle | collecting_name | collecting_phone | collecting_email | collecting_roll | collecting_marks | collecting_slot | confirm
  let chatState = 'idle';
  let pendingProgram = null;
  let collectedData  = {};

  // ── Init ───────────────────────────────────────────────────────────────────
  (async () => {
    try {
      const r = await fetch('/api/auth/me');
      if (!r.ok) { window.location.href = '/login.html'; return; }
      const { user } = await r.json();
      document.getElementById('nav-name').textContent = user.full_name;
      document.getElementById('profile-name').textContent = user.full_name;
    } catch { window.location.href = '/login.html'; }

    loadPrograms();
    loadProfile();
    loadSlots();
    appendBotMsg(`👋 Hello! I'm your **Admission Assistant**.\n\nHere's what I can do:\n• 🎓 Book a seat → click a program button or type **I want CSE**\n• 📋 See all courses → type **show programs**\n• 📅 Check slots → type **show slots**\n• ❌ Cancel anytime → type **cancel**\n\nWhat would you like to do today?`);
  })();

  // ── Load data ──────────────────────────────────────────────────────────────
  async function loadPrograms() {
    const r = await fetch('/api/programs');
    const { programs } = await r.json();
    const list = document.getElementById('programs-list');
    list.innerHTML = programs.map(p => `
      <div class="program-chip" onclick="sendQuick('I want ${p.name}')">
        <span>${p.name}</span>
        <span class="seats">${p.available_seats} seats</span>
      </div>`).join('');
  }

  async function loadProfile() {
    try {
      const r = await fetch('/api/student/profile');
      if (!r.ok) return;
      const { booking } = await r.json();
      if (booking) renderBookingStatus(booking);
    } catch {}
  }

  let slotOptions = [];
  async function loadSlots() {
    const r = await fetch('/api/slots');
    const { slots } = await r.json();
    slotOptions = slots.filter(s => s.available > 0);
  }

  // ── Chat messaging ─────────────────────────────────────────────────────────
  function appendBotMsg(text) {
    const wrap = document.getElementById('chat-messages');
    const div  = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-bubble">${formatText(text)}</div>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
    return div;
  }

  function appendUserMsg(text) {
    const wrap = document.getElementById('chat-messages');
    const div  = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `
      <div class="msg-avatar">👤</div>
      <div class="msg-bubble">${escapeHtml(text)}</div>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function showTyping() {
    const wrap = document.getElementById('chat-messages');
    const div  = document.createElement('div');
    div.className = 'msg bot'; div.id = 'typing-indicator';
    div.innerHTML = `<div class="msg-avatar">🤖</div><div class="msg-bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    wrap.appendChild(div);
    wrap.scrollTop = wrap.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function formatText(t) {
    return escapeHtml(t)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br/>');
  }

  function escapeHtml(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Conversational flow ────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text  = input.value.trim();
    if (!text) return;
    input.value = '';
    autoResize(input);
    appendUserMsg(text);

    // ── GUIDED BOOKING FLOW — all handled 100% on frontend, never hits /api/chat ──

    if (chatState === 'collecting_name') {
      collectedData.fullName = text;
      chatState = 'collecting_phone';
      appendBotMsg(`Nice to meet you, **${text}**! 😊\n\nWhat is your **phone number**?`);
      return;
    }

    if (chatState === 'collecting_phone') {
      // basic phone check
      const cleaned = text.replace(/\s+/g, '');
      if (cleaned.length < 7) {
        appendBotMsg(`Please enter a valid phone number (e.g. 9876543210).`);
        return;
      }
      collectedData.phone = text;
      chatState = 'collecting_email';
      appendBotMsg(`Got it! What is your **email address**?`);
      return;
    }

    if (chatState === 'collecting_email') {
      if (!text.includes('@') || !text.includes('.')) {
        appendBotMsg(`That doesn't look like a valid email. Please enter a valid email address.`);
        return;
      }
      collectedData.email = text;
      chatState = 'collecting_roll';
      appendBotMsg(`What is your **Roll Number**?\n(Type **skip** if you don't have one yet)`);
      return;
    }

    if (chatState === 'collecting_roll') {
      collectedData.rollNo = text.toLowerCase() === 'skip' ? '' : text;
      chatState = 'collecting_marks';
      appendBotMsg(`What are your **12th board marks**?\n\nYou can enter:\n• Percentage: **88** or **88%**\n• Fraction: **440/500**`);
      return;
    }

    if (chatState === 'collecting_marks') {
      // validate marks format before accepting
      const parsed = parseMarks(text);
      if (parsed === null) {
        appendBotMsg(`I couldn't read that. Please enter your marks as a percentage (e.g. **88**) or fraction (e.g. **440/500**).`);
        return;
      }
      collectedData.marks     = text;
      collectedData.marksPct  = parsed;
      chatState = 'collecting_slot';
      const slotList = slotOptions.length
        ? slotOptions.map((s, i) => `  **${i+1}.** ${s.slot_date} at ${s.slot_time} (${s.available} seats left)`).join('\n')
        : '  _(No slots available right now)_';
      appendBotMsg(`Great! Your marks: **${parsed}%**\n\nNow choose a **counseling slot**:\n${slotList}\n\nReply with the slot number (e.g. **1**).`);
      return;
    }

    if (chatState === 'collecting_slot') {
      const idx = parseInt(text, 10) - 1;
      if (isNaN(idx) || idx < 0 || !slotOptions[idx]) {
        appendBotMsg(`Please enter a valid slot number between **1** and **${slotOptions.length}**.`);
        return;
      }
      collectedData.slotId    = slotOptions[idx].id;
      collectedData.slotLabel = `${slotOptions[idx].slot_date} at ${slotOptions[idx].slot_time}`;
      chatState = 'confirm';
      appendBotMsg(
        `Almost done! Please review your details:\n\n` +
        `🎓 **Program:** ${pendingProgram}\n` +
        `👤 **Name:** ${collectedData.fullName}\n` +
        `📧 **Email:** ${collectedData.email}\n` +
        `📱 **Phone:** ${collectedData.phone}\n` +
        `🔢 **Roll No:** ${collectedData.rollNo || '—'}\n` +
        `📊 **12th Marks:** ${collectedData.marksPct}%\n` +
        `📅 **Slot:** ${collectedData.slotLabel}\n\n` +
        `Type **confirm** to book your seat, or **cancel** to start over.`
      );
      return;
    }

    if (chatState === 'confirm') {
      const t = text.toLowerCase().trim();
      if (t === 'confirm' || t === 'yes') {
        chatState = 'idle';
        await doBooking();
      } else if (t === 'cancel' || t === 'no') {
        chatState = 'idle'; pendingProgram = null; collectedData = {};
        appendBotMsg(`Booking cancelled. No worries! Type **I want CSE** (or any program) to start again.`);
      } else {
        appendBotMsg(`Please type **confirm** to complete the booking or **cancel** to start over.`);
      }
      return;
    }

    // ── NORMAL CHAT — only reaches here when state is 'idle' ─────────────────
    // Check for program keywords first (handled locally, no server needed)
    const detected = detectProgramLocally(text);
    if (detected) {
      pendingProgram = detected;
      chatState = 'collecting_name';
      appendBotMsg(`Great choice — **${detected}**! 🎉\n\nLet me collect a few details to book your seat.\n\nFirst, what is your **full name**?`);
      return;
    }

    // keywords handled locally
    const lower = text.toLowerCase();
    if (lower.includes('program') || lower.includes('course') || lower.includes('branch') || lower.includes('show')) {
      const r = await fetch('/api/programs');
      const { programs } = await r.json();
      const list = programs.map(p => `• **${p.name}** — Min: ${p.min_score}% | Seats left: ${p.available_seats}`).join('\n');
      appendBotMsg(`Here are all available programs:\n\n${list}\n\nClick a program button above or type **I want CSE** to start booking!`);
      return;
    }
    if (lower.includes('slot') || lower.includes('schedule') || lower.includes('date')) {
      if (!slotOptions.length) { appendBotMsg('No counseling slots are available right now. Please check back later.'); return; }
      const list = slotOptions.map(s => `• ${s.slot_date} at ${s.slot_time} — ${s.available} seats left`).join('\n');
      appendBotMsg(`Available counseling slots:\n\n${list}`);
      return;
    }
    if (lower.includes('book') || lower.includes('apply') || lower.includes('seat') || lower.includes('admission')) {
      appendBotMsg(`To book a seat, just tell me which program you want!\n\nFor example: **I want CSE** or click a program button above.`);
      return;
    }
    if (lower.includes('hello') || lower.includes('hi') || lower.includes('hey')) {
      appendBotMsg(`Hello! 👋 I'm your Admission Assistant.\n\nI can help you:\n• Book a seat → say **I want CSE**\n• See all courses → say **show programs**\n• Check slots → say **show slots**`);
      return;
    }

    // fall back to server only for truly unknown messages
    showTyping();
    try {
      const r    = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await r.json();
      removeTyping();
      appendBotMsg(data.reply || `I'm not sure about that. Type **show programs** to see available courses or **I want CSE** to start booking!`);
    } catch {
      removeTyping();
      appendBotMsg('Connection error. Please check your internet and try again.');
    }
  }

  // ── Direct booking (no booking panel popup — fully in chat) ──────────────
  async function doBooking() {
    appendBotMsg(`⏳ Booking your seat, please wait…`);
    try {
      const r = await fetch('/api/book', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullName:    collectedData.fullName,
          email:       collectedData.email,
          phone:       collectedData.phone,
          rollNo:      collectedData.rollNo || '',
          marks12:     collectedData.marksPct,
          programName: pendingProgram,
          slotId:      collectedData.slotId,
        }),
      });
      const data = await r.json();
      if (!r.ok) {
        appendBotMsg(`❌ **Booking failed:** ${data.error}\n\nType **I want ${pendingProgram}** to try again.`);
        pendingProgram = null; collectedData = {};
        return;
      }
      const b = data.booking;
      appendBotMsg(
        `🎉 **Seat Booked Successfully!**\n\n` +
        `• **Booking ID:** ${b.bookingId}\n` +
        `• **Program:** ${b.program}\n` +
        `• **Your Marks:** ${b.marks}%\n` +
        `• **Counseling Date:** ${b.slotDate} at ${b.slotTime}\n\n` +
        `Please carry your **original marksheet** and **ID proof** on counseling day. Best of luck! 🍀`
      );
      renderBookingStatus(b);
      pendingProgram = null; collectedData = {};
      loadPrograms(); // refresh seat counts
    } catch {
      appendBotMsg(`❌ Network error while booking. Please try again.`);
      pendingProgram = null; collectedData = {};
    }
  }

  // ── Local program detection (no server call) ──────────────────────────────
  function detectProgramLocally(message) {
    const t = message.toLowerCase().replace(/\s+/g, ' ').trim();
    if (!t) return null;
    if (/\b(ai\s*&?\s*data|data\s*science|aids)\b/.test(t)) return 'AI & Data Science';
    if (/\bcse\b/.test(t) || t.includes('computer science')) return 'CSE';
    if (/\bece\b/.test(t) || t.includes('electronics')) return 'ECE';
    if (t.includes('mechanical') || /\bmech\b/.test(t)) return 'Mechanical';
    if (/\bcivil\b/.test(t)) return 'Civil';
    if (t.includes('biotechnology') || /\bbiotech\b/.test(t)) return 'Biotechnology';
    return null;
  }

  // ── Parse marks on frontend (mirrors server logic) ────────────────────────
  function parseMarks(input) {
    const s = String(input || '').trim();
    const slash = s.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
    if (slash) {
      const num = Number(slash[1]), den = Number(slash[2]);
      if (den > 0) return Math.round((num / den) * 1000) / 10;
    }
    const n = parseFloat(s.replace(/%/g, ''));
    if (isNaN(n)) return null;
    if (n <= 100) return Math.round(n * 10) / 10;
    if (n <= 600) return Math.round((n / 500) * 1000) / 10;
    return null;
  }

  function sendQuick(text) {
    // if currently mid-flow, don't hijack with a quick button
    if (chatState !== 'idle') {
      appendBotMsg(`⚠️ You're in the middle of a booking. Type **cancel** to start over, or finish the current flow.`);
      return;
    }
    document.getElementById('chat-input').value = text;
    sendMessage();
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function renderBookingStatus(b) {
    const card = document.getElementById('booking-status-card');
    card.className = 'booking-status active';
    card.innerHTML = `
      <div class="label" style="color:var(--success);">✅ Seat Booked</div>
      <div class="value">${b.program_name || b.program}</div>
      <div style="font-size:.78rem;color:var(--muted);margin-top:.2rem;">${b.slotDate || b.slot_date} ${b.slotTime || b.slot_time}</div>
      <div style="font-size:.78rem;color:var(--muted);">ID: ${b.bookingId || b.booking_id}</div>`;
  }

  // ── Logout ─────────────────────────────────────────────────────────────────
  async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = '/login.html';
  }
</script>
</body>
</html>
